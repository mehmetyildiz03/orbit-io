name: Deploy Orbit.io to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical V3.16.12 source
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon-180.png
          test -f icon-512.png

          grep -q 'V3.16.12' index.html
          grep -q 'STICKY RELATIVE AIM' index.html
          grep -q "MOBILE_BUILD='3.16.12-sticky-relative-aim'" index.html
          grep -q "controls.addEventListener('pointerdown'" index.html
          grep -q "controls.addEventListener('pointercancel',e=>endAim(e,false))" index.html
          grep -q "controls.addEventListener('lostpointercapture',e=>endAim(e,false))" index.html
          grep -q "joy.addEventListener('lostpointercapture',endJoy)" index.html
          grep -q "bh.addEventListener('lostpointercapture',stopBH)" index.html
          grep -q "document.addEventListener('visibilitychange'" index.html
          grep -q "addEventListener('pagehide',cancelTransientInput" index.html
          ! grep -q "controls.addEventListener('pointercancel',endAim)" index.html
          grep -q "function scheduleViewportSync(recenter=true)" index.html
          grep -q "const backingStoreChanged=C.width!==pixelW||C.height!==pixelH" index.html
          grep -q "if(backingStoreChanged)" index.html
          grep -q "visualViewport.addEventListener('scroll',()=>scheduleViewportSync(true)" index.html
          ! grep -q "visualViewport.addEventListener('scroll',syncViewport" index.html
          grep -q "resize(false,true)" index.html
          grep -q "function updateMobileCameraMass(dt)" index.html
          grep -q "mobileCameraRecoveryDelay=.80" index.html
          grep -q "mobileCameraMass=Math.max(currentMass,mobileCameraMass-14\*dt)" index.html
          grep -q "const zoomRate=desiredZoom<cam.zoom?2.7:.48" index.html
          grep -q "return clamp(.62+(shortSide-390)\*.00016,.60,.68)" index.html
          ! grep -q "runStats.maxMass||8" index.html
          ! grep -q "cam.targetZoom=Math.min(cam.zoom,desiredZoom)" index.html
          grep -q "body.touch-mode #miniWrap{right:max(7px,env(safe-area-inset-right));top:max(158px" index.html
          grep -q "@media(max-height:440px)" index.html
          grep -q "body.touch-mode #miniWrap{top:max(145px" index.html
          grep -q "@media(max-height:350px)" index.html
          grep -q "body.touch-mode #stance{top:max(38px" index.html
          grep -q "function mobilePortraitBlocked()" index.html
          grep -q "body.touch-mode #rotateHint{display:flex;pointer-events:auto}" index.html
          grep -q "body.touch-mode #mobileControls.active{pointer-events:none}" index.html
          grep -q "if(e.pointerType==='mouse'||!running||mobilePortraitBlocked())return" index.html
          grep -q "if(e.pointerType==='mouse'||!running||!player||mobilePortraitBlocked())return" index.html
          grep -q "rotateHint.addEventListener('pointerdown'" index.html
          grep -q "const dragActivation=7" index.html
          grep -q "if(!point.relative&&d<dragActivation)" index.html
          grep -q "point.relative=true" index.html
          grep -q "relative:false,dirX:0,dirY:0" index.html
          ! grep -q "const deadZone=14" index.html
          grep -q 'orbit-io-v3-16-12' service-worker.js

          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/orbit-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/orbit-inline.js

      - name: Build static PWA from canonical source
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/index.html
          cp manifest.webmanifest dist/manifest.webmanifest
          cp service-worker.js dist/service-worker.js
          cp icon-180.png dist/icon-180.png
          cp icon-512.png dist/icon-512.png
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
