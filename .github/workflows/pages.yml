name: Deploy Orbit.io to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical V3.16.6 source
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon-180.png
          test -f icon-512.png

          grep -q 'V3.16.6' index.html
          grep -q 'GLOBAL TOUCH ROUTER' index.html
          grep -q "MOBILE_BUILD='3.16.6-global-router'" index.html
          grep -q "controls.addEventListener('pointerdown'" index.html
          grep -q 'orbit-io-v3-16-6' service-worker.js

          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/orbit-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/orbit-inline.js

      - name: Build static PWA from canonical source
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/index.html
          cp manifest.webmanifest dist/manifest.webmanifest
          cp service-worker.js dist/service-worker.js
          cp icon-180.png dist/icon-180.png
          cp icon-512.png dist/icon-512.png
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
