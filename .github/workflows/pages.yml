name: Deploy Orbit.io to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static PWA
        run: |
          set -euo pipefail
          mkdir -p dist
          cat pwa/site.part* | base64 --decode | gzip --decompress > dist/index.html
          cp pwa/manifest.webmanifest dist/manifest.webmanifest
          cp pwa/service-worker.js dist/service-worker.js
          base64 --decode pwa/icon-180.png.b64 > dist/icon-180.png
          base64 --decode pwa/icon-512.png.b64 > dist/icon-512.png
          touch dist/.nojekyll
          grep -q 'V3.16.2' dist/index.html
          grep -q 'manifest.webmanifest' dist/index.html
          grep -q 'apple-mobile-web-app-capable' dist/index.html
          grep -q 'visualViewport' dist/index.html
          grep -q 'touchCapable?.82:1.06' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
